<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="校迹：河南财政金融学院龙子湖校区地点查询原型。">
  <title>校迹 · 龙子湖校区地点地图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23173f35'/%3E%3Cpath d='M18 17h28v8H18zm5 13h18v8H23zm6 13h6v8h-6z' fill='%23e6b85c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#mapViewport">跳到校园地图</a>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="校迹首页">
        <span class="brand-mark" aria-hidden="true">校</span>
        <span><strong>校迹</strong><small>让校园更好找</small></span>
      </a>
      <div class="campus-context">
        <span class="context-dot" aria-hidden="true"></span>
        <span>河南财政金融学院</span>
        <strong>龙子湖校区</strong>
      </div>
    </header>

    <main class="workspace">
      <section class="map-panel" aria-label="校园地点地图">
        <div class="search-panel">
          <div class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
            <label class="sr-only" for="placeSearch">搜索校园地点</label>
            <input id="placeSearch" type="search" autocomplete="off" placeholder="搜索教学楼、食堂、宿舍或校门" aria-controls="searchResults" aria-expanded="false">
            <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索" hidden>×</button>
          </div>
          <div class="category-row" id="categoryFilters" aria-label="地点类别筛选"></div>
          <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果" hidden></div>
        </div>

        <div class="map-viewport" id="mapViewport" tabindex="0" aria-label="可拖动和缩放的校园参考地图">
          <div class="map-frame" id="mapFrame">
            <div class="map-layer" id="mapLayer">
              <img class="campus-map-image" src="./assets/campus-map-original.png" width="1080" height="1535" alt="河南财政金融学院龙子湖校区平面参考图，非官方地图">
              <div class="marker-layer" id="markerLayer" aria-label="可点击的建筑物和地点名称"></div>
            </div>
          </div>

          <div class="map-notice" role="note">
            <strong>原型底图</strong>
            <span>来源：财金小喇叭公开图片 · 非学校官方地图</span>
          </div>

          <div class="map-controls" aria-label="地图控制">
            <button id="zoomIn" type="button" aria-label="放大地图">+</button>
            <button id="zoomOut" type="button" aria-label="缩小地图">−</button>
            <button id="resetMap" class="reset-control" type="button" aria-label="恢复地图全景">全景</button>
          </div>
          <div class="map-help" id="mapHelp">拖动浏览 · 滚轮或按钮缩放</div>
        </div>
      </section>

      <aside class="detail-panel" id="detailPanel" aria-label="地点详情" aria-live="polite">
        <div class="detail-empty" id="detailEmpty">
          <span class="empty-icon" aria-hidden="true">⌖</span>
          <p class="eyebrow">地点信息</p>
          <h1>选择一个地点</h1>
          <p>点击地图标记，或搜索名称、简称和地点类别。</p>
          <div class="trust-note"><strong>可信信息原则</strong><span>未经实地核验的内容会明确标为“待核实”，不会被写成确定事实。</span></div>
        </div>

        <article class="detail-content" id="detailContent" hidden>
          <header class="detail-header">
            <div><span class="category-label" id="detailCategory"></span><span class="verification-badge" id="detailStatus"></span></div>
            <button class="close-detail" id="closeDetail" type="button" aria-label="关闭地点详情">×</button>
          </header>
          <h1 id="detailName"></h1>
          <p class="detail-summary" id="detailSummary"></p>

          <dl class="fact-list">
            <div><dt>主要入口</dt><dd id="detailEntrance"></dd></div>
            <div><dt>开放时间</dt><dd id="detailHours"></dd></div>
            <div><dt>设施信息</dt><dd id="detailFacilities"></dd></div>
            <div><dt>到访提醒</dt><dd id="detailNotice"></dd></div>
          </dl>

          <section class="source-card" aria-labelledby="sourceTitle">
            <div class="source-heading">
              <div><p class="eyebrow" id="sourceTitle">信息依据</p><h2><span id="detailConfidence"></span>可信度</h2></div>
              <time id="detailUpdated"></time>
            </div>
            <ul id="detailSources"></ul>
          </section>
        </article>
      </aside>
    </main>
  </div>

  <div class="sr-only" id="statusMessage" role="status" aria-live="polite"></div>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
