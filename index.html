  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --text: #172033;
      --muted: #5f6b7a;
      --line: #e4e9f0;
      --primary: #1f4fa8;
      --primary-2: #386fc8;
      --accent: #187d72;
      --accent-2: #ffd166;
      --shadow: 0 16px 42px rgba(23, 32, 51, .07);
      --shadow-soft: 0 8px 24px rgba(23, 32, 51, .05);
      --radius: 12px;
      --radius-sm: 8px;
      --max: 1160px;
      --nav-h: 72px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      letter-spacing: 0;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .container { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--nav-h);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }

    .nav-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
      font-weight: 850;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      object-position: center;
      border: 1px solid var(--line);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      padding: 8px 11px;
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
      font-size: 14px;
      transition: 180ms ease;
    }
    .nav-links a:hover { color: var(--text); background: color-mix(in srgb, var(--primary) 10%, transparent); }

    .nav-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn, .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, border 180ms ease;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover, .btn:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--primary) 34%, var(--line)); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 15px;
      font-weight: 700;
    }
    .btn.primary {
      border-color: transparent;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 14px 30px rgba(36, 87, 214, .22);
    }

    .hero { position: relative; padding: 64px 0 30px; }

    .pig-easter-egg {
      position: absolute;
      top: 88px;
      right: 24px;
      z-index: 5;
      width: 76px;
      height: 76px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .pig-easter-egg:hover,
    .pig-easter-egg:focus-visible {
      transform: translateY(-3px) scale(1.04);
      filter: drop-shadow(0 8px 12px rgba(23, 32, 51, .12));
      outline: none;
    }

    .pig-easter-egg:focus-visible { box-shadow: 0 0 0 3px rgba(31, 79, 168, .22); }
    .pig-easter-egg img { display: block; width: 100%; height: 100%; object-fit: contain; }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.26fr .74fr;
      gap: 26px;
      align-items: stretch;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-main { padding: 42px; }

    .identity {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .hero-avatar {
      width: 128px;
      height: 128px;
      flex: 0 0 auto;
      border-radius: 8px;
      object-fit: contain;
      object-position: center;
      background: #f6f7f9;
      border: 4px solid #fff;
      box-shadow: 0 0 0 1px var(--line), var(--shadow-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 74px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
      max-width: 760px;
    }

    .motto {
      position: relative;
      margin: 28px 0 0;
      padding: 20px 22px 20px 26px;
      border-left: 4px solid var(--primary);
      background: #f5f8fc;
      color: var(--text);
      font-family: "STKaiti", "KaiTi", "Microsoft YaHei", sans-serif;
      font-size: clamp(18px, 2vw, 23px);
      font-weight: 700;
      line-height: 1.75;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface-strong) 76%, transparent);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

    .profile-card {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 100%;
    }

    .profile-card h2 { margin: 0; font-size: 22px; }
    .profile-card .contact-note { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

    .contact-list { display: grid; gap: 10px; margin-top: 20px; }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbfd;
      color: var(--muted);
      font-size: 14px;
    }
    .contact-item strong { color: var(--text); font-size: 13px; }

    section { padding: 34px 0; scroll-margin-top: calc(var(--nav-h) + 16px); }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .section-head h2 { margin: 0; font-size: 28px; line-height: 1.2; }
    .section-head p { margin: 6px 0 0; color: var(--muted); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .metric {
      padding: 20px;
      min-height: 132px;
      transition: 200ms ease;
    }
    .metric:hover, .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .metric b {
      display: block;
      font-size: 32px;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .metric span { color: var(--muted); font-size: 14px; }

    .journey-shell {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fafbfc;
      padding: 8px 34px;
    }

    .journey-kicker {
      color: var(--accent);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .journey-title {
      margin: 0 0 22px;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.12;
    }

    .journey-title::after { content: "."; color: var(--accent); }

    .journey-list { display: grid; }
    .journey-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      align-items: center;
      gap: 24px;
      min-height: 82px;
      border-top: 1px solid var(--line);
    }
    .journey-row:first-child { border-top: 0; }
    .journey-label { color: #8a94a3; font-weight: 750; }
    .journey-value {
      color: var(--text);
      font-size: 20px;
      font-weight: 850;
      text-align: right;
    }

    .tabs {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .tablist {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tablist::-webkit-scrollbar { display: none; }
    .tab {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 800;
      transition: 180ms ease;
    }
    .tab[aria-selected="true"] {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 22px rgba(36, 87, 214, .18);
    }
    .tabpanel { padding: 18px; }

    .timeline { display: grid; gap: 14px; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--surface-strong) 82%, transparent);
      padding: 20px;
      transition: 200ms ease;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }
    .card h3 { margin: 0; font-size: 19px; line-height: 1.35; }
    .meta { color: var(--muted); font-size: 14px; font-weight: 700; white-space: nowrap; }
    .role { color: var(--primary); font-weight: 850; margin-top: 2px; }
    ul.clean { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    ul.clean li {
      position: relative;
      padding-left: 18px;
      color: var(--muted);
    }
    ul.clean li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .72em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .project-card .stack { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .mini {
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .edu-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
    .award-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

    .footer {
      padding: 34px 0 48px;
      color: var(--muted);
      text-align: center;
    }

    .to-top {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }
    .to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .fade-in { animation: fadeIn .45s ease both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
    }

    @media (max-width: 920px) {
      .hero-grid, .edu-grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .project-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .pig-easter-egg { top: 80px; right: 14px; width: 60px; height: 60px; }
    }

    @media (max-width: 560px) {
      .container { width: min(100% - 24px, var(--max)); }
      .hero { padding-top: 34px; }
      .pig-easter-egg { top: 18px; width: 52px; height: 52px; }
      .hero-main, .profile-card { padding: 24px; }
      .metrics { grid-template-columns: 1fr; }
      .identity { align-items: flex-start; gap: 16px; }
      .hero-avatar { width: 94px; height: 94px; }
      .journey-shell { padding: 4px 20px; }
      .journey-row { grid-template-columns: 92px 1fr; gap: 14px; min-height: 72px; }
      .journey-value { font-size: 16px; }
      .card-head { display: grid; }
      .meta { white-space: normal; }
      .btn { width: 100%; }
      .hero-actions { width: 100%; }
      .nav-actions .btn { display: none; }
    }

    @media print {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-strong: #ffffff;
        --text: #111827;
        --muted: #374151;
        --line: #d1d5db;
        --primary: #1d4ed8;
        --accent: #0f766e;
        --shadow: none;
        --shadow-soft: none;
      }
      body { background: #fff; font-size: 12px; }
      body::before, .nav, .to-top, .pig-easter-egg, .hero-actions, .tablist, .footer { display: none !important; }
      .container { width: 100%; padding: 0 10mm; }
      .hero { padding: 0 0 8mm; }
      .hero-grid, .edu-grid, .project-grid, .metrics { grid-template-columns: 1fr 1fr; gap: 8px; }
      section { padding: 5mm 0; break-inside: avoid; }
      .panel, .tabs, .card { box-shadow: none; break-inside: avoid; }
      .tabpanel { display: block !important; padding: 0; }
      .tabpanel[hidden] { display: block !important; }
      .card { padding: 12px; }
      h1 { font-size: 38px; }
      .subtitle { font-size: 14px; }
    }
  </style>
</head>

    const $ = (sel, root = document) => root.querySelector(sel);
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function renderBadges(target, items) {
      target.innerHTML = "";
      items.forEach(item => target.appendChild(el("span", "badge", item)));
    }

    function renderList(items) {
      const ul = el("ul", "clean");
      items.forEach(item => ul.appendChild(el("li", "", item)));
      return ul;
    }

    function renderCards(items, root, project = false) {
      root.innerHTML = "";
      const wrap = el("div", project ? "project-grid" : "timeline");
      items.forEach(item => {
        const card = el("article", "card" + (project ? " project-card" : ""));
        const head = el("div", "card-head");
        const left = el("div");
        const title = el("h3", "", item.title);
        if (item.link) {
          const a = el("a");
          a.href = item.link;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = item.title + " ↗";
          title.textContent = "";
          title.appendChild(a);
        }
        left.appendChild(title);
        left.appendChild(el("div", "role", item.role));
        head.appendChild(left);
        head.appendChild(el("div", "meta", item.time));
        card.appendChild(head);
        if (item.stack) {
          const stack = el("div", "stack");
          item.stack.forEach(s => stack.appendChild(el("span", "mini", s)));
          card.appendChild(stack);
        }
        card.appendChild(renderList(item.bullets));
        wrap.appendChild(card);
      });
      root.appendChild(wrap);
    }

    function renderTabs(rootId, tabs, project = false) {
      const root = $("#" + rootId);
      const tablist = el("div", "tablist");
      tablist.setAttribute("role", "tablist");
      const panels = [];

      tabs.forEach((tabData, i) => {
        const tab = el("button", "tab", tabData.name);
        const tabId = rootId + "-tab-" + i;
        const panelId = rootId + "-panel-" + i;
        tab.id = tabId;
        tab.type = "button";
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-controls", panelId);
        tab.setAttribute("aria-selected", i === 0 ? "true" : "false");
        tab.tabIndex = i === 0 ? 0 : -1;
        tab.addEventListener("click", () => activate(i));
        tab.addEventListener("keydown", e => {
          if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
          e.preventDefault();
          const next = e.key === "ArrowRight" ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
          activate(next);
          tablist.children[next].focus();
        });
        tablist.appendChild(tab);

        const panel = el("div", "tabpanel");
        panel.id = panelId;
        panel.setAttribute("role", "tabpanel");
        panel.setAttribute("aria-labelledby", tabId);
        if (i !== 0) panel.hidden = true;
        renderCards(tabData.items, panel, project);
        panels.push(panel);
      });

      function activate(index) {
        [...tablist.children].forEach((tab, i) => {
          tab.setAttribute("aria-selected", i === index ? "true" : "false");
          tab.tabIndex = i === index ? 0 : -1;
          panels[i].hidden = i !== index;
        });
      }

      root.appendChild(tablist);
      panels.forEach(panel => root.appendChild(panel));
    }

    function init() {

      renderBadges($("#tags"), resume.tags);

      const journeyList = $("#journeyList");

        row.appendChild(el("div", "journey-label", label));
        row.appendChild(el("div", "journey-value", value));

      });

      const contacts = $("#contacts");
      resume.contacts.forEach(([k, v]) => {
        const row = el("div", "contact-item");
        row.appendChild(el("strong", "", k));
        row.appendChild(el("span", "", v));
        contacts.appendChild(row);
      });

      const metrics = $("#metrics");
      resume.metrics.forEach(m => {
        const card = el("article", "panel metric");
        card.appendChild(el("b", "", m.value));
        card.appendChild(el("span", "", m.label));
        metrics.appendChild(card);
      });

      renderTabs("experienceTabs", resume.experienceTabs, false);
      renderTabs("projectTabs", resume.projectTabs, true);

      const edu = $("#eduCards");
      edu.appendChild(el("h3", "", "教育背景"));
      resume.education.forEach(item => {
        const block = el("div", "", "");
        block.style.marginTop = "16px";
        const head = el("div", "card-head");
        const left = el("div");
        left.appendChild(el("h3", "", item.school));
        left.appendChild(el("div", "role", item.major));
        head.appendChild(left);
        head.appendChild(el("div", "meta", item.time));
        block.appendChild(head);
        block.appendChild(renderList(item.bullets));
        edu.appendChild(block);
      });

      renderBadges($("#awards"), resume.awards);
      $("#footerText").textContent = "© " + new Date().getFullYear() + " " + resume.name + " · 更新时间 " + resume.updatedAt;

      const email = resume.emailUser + "@" + resume.emailDomain;
      $("#copyEmail").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(email);
          $("#copyEmail").textContent = "已复制邮箱";
          setTimeout(() => $("#copyEmail").textContent = "复制邮箱", 1600);
        } catch {
          location.href = "mailto:" + email;
        }
      });

      const toTop = $("#toTop");
      window.addEventListener("scroll", () => {
        toTop.classList.toggle("show", window.scrollY > 560);
      }, { passive: true });
      toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

      const pig = $("#pigEasterEgg");
      const pigImage = $("#pigImage");
      const startPigRoll = () => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        pigImage.src = "google-pig-roll.webp?play=" + Date.now();
        pigImage.alt = "正在翻滚的谷歌小猪";
      };
      const stopPigRoll = () => {
        pigImage.src = "google-pig-still.png";
        pigImage.alt = "一只等待翻滚的谷歌小猪";
      };
      pig.addEventListener("mouseenter", startPigRoll);
      pig.addEventListener("mouseleave", stopPigRoll);
      pig.addEventListener("focus", startPigRoll);
      pig.addEventListener("blur", stopPigRoll);
    }

    init();
  </script>
